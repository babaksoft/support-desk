name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Black
            command: timeout 30s uv run --locked black --check src tests
          - name: isort
            command: uv run --locked isort --check-only src tests
          - name: Ruff
            command: uv run --locked ruff check src tests
          - name: mypy
            command: uv run --locked mypy src tests
          - name: pytest
            command: uv run --locked pytest -v
          - name: Package build
            command: uv build
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}
