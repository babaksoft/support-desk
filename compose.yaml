services:
  database:
    image: postgres:17.12@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    environment:
      POSTGRES_DB: support_desk
      POSTGRES_PASSWORD: synthetic-local-password
      POSTGRES_USER: support_desk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_desk -d support_desk"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - support-desk-postgres:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://support_desk:synthetic-local-password@database/support_desk

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://support_desk:synthetic-local-password@database/support_desk
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SUPPORT_DESK_AUTH_MODE: local
      SUPPORT_DESK_ENABLE_INFERENCE: ${SUPPORT_DESK_ENABLE_INFERENCE:-0}
      SUPPORT_DESK_MODEL: ${SUPPORT_DESK_MODEL:-}
    ports:
      - "127.0.0.1:8000:8000"

  ui:
    build: .
    command:
      - /app/.venv/bin/streamlit
      - run
      - /app/src/support_desk/composition/ui.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    depends_on:
      api:
        condition: service_healthy
    environment:
      SUPPORT_DESK_API_URL: http://api:8000
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    ports:
      - "127.0.0.1:8501:8501"

volumes:
  support-desk-postgres:
