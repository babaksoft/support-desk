[project]
name = "support-desk"
version = "0.1.0"
description = "A support desk learning project for AI Engineering, LLMOps, and DevOps."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "openai>=3.46.0",
    "openai-agents>=0.24.0",
    "pydantic>=2.14.3",
    "pyjwt[crypto]>=2.10.1,<3",
    "starlette>=1.10.0",
    "streamlit>=1.63.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "ANN", "D"]
# Repository style requires a blank line after function docstrings.
ignore = ["D202", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.4",
]
